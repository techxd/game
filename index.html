<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寒霜啟示錄 - Whiteout Survival 迷你冒險</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #dbe9f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  #webgl-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* === Top Left: Whiteout Survival Logo & Store Button === */
  #top-left-ad {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    pointer-events: auto;
  }
  .logo-box {
    display: flex;
    flex-direction: column;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45));
  }
  .logo-title {
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 
      -1.5px -1.5px 0 #1b4965,  
       1.5px -1.5px 0 #1b4965,
      -1.5px  1.5px 0 #1b4965,
       1.5px  1.5px 0 #1b4965,
       0px 3px 0 #123447;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .logo-sub {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    font-weight: 800;
    color: #edf2f7;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    letter-spacing: 0.5px;
  }
  .logo-sub .play-badge {
    background: rgba(0,0,0,0.4);
    padding: 1px 4px;
    border-radius: 4px;
    font-size: 8px;
  }
  .logo-sub .en-title {
    color: #ffd166;
  }
  .btn-play-now {
    margin-top: 4px;
    background: linear-gradient(180deg, #2ecc71 0%, #27ae60 50%, #1e8449 100%);
    color: #ffffff;
    font-size: 15px;
    font-weight: 900;
    padding: 7px 18px;
    border-radius: 20px;
    border: 2px solid #a9dfbf;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35), 0 0 12px rgba(46,204,113,0.55);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    animation: pulse-glow 2s infinite ease-in-out;
    transition: transform 0.1s ease;
  }
  .btn-play-now:active {
    transform: scale(0.95);
  }
  @keyframes pulse-glow {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.35), 0 0 10px rgba(46,204,113,0.5);
    }
    50% {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0,0,0,0.4), 0 0 18px rgba(46,204,113,0.85);
    }
  }

  /* === Top Right: 4 Vertical Resource Slots (Video Exact) === */
  #top-right-hud {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: none;
  }
  .res-pill {
    background: rgba(18, 30, 49, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    padding: 3px 12px 3px 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 90px;
    justify-content: flex-start;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .res-pill.bounce {
    transform: scale(1.18);
  }
  .res-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .res-val {
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    flex: 1;
    text-align: right;
  }

  /* === Virtual Joystick Area === */
  #joystick-zone {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 25;
    pointer-events: auto;
  }
  #joystick-base {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(200,220,240,0.25) 70%, rgba(150,180,210,0.4) 100%);
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 15px rgba(0,0,0,0.15), inset 0 2px 6px rgba(255,255,255,0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  #joystick-base:active {
    cursor: grabbing;
  }
  #joystick-knob {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #d8e5ee 70%, #b0c6d8 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.25), inset 0 1px 3px rgba(255,255,255,0.9);
    position: absolute;
    pointer-events: none;
    transition: transform 0.05s ease-out;
  }
  #joystick-hint {
    margin-top: 8px;
    color: rgba(30, 50, 70, 0.7);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    pointer-events: none;
    transition: opacity 0.3s;
  }

  /* === Floating Floating Text === */
  #floating-text-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 30;
    overflow: hidden;
  }
  .float-label {
    position: absolute;
    font-weight: 900;
    font-size: 16px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: floatUp 0.85s forwards ease-out;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .float-label.wood { color: #f4a261; }
  .float-label.cash { color: #2ecc71; font-size: 18px; }
  .float-label.meat { color: #ff7675; }
  .float-label.gold { color: #f1c40f; }
  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.85);
    }
    30% {
      transform: translate(-50%, -85%) scale(1.15);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -140%) scale(1.0);
    }
  }

  /* === Whiteout Survival Ad Store Modal === */
  #store-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 20, 35, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .store-card {
    background: linear-gradient(145deg, #162438, #0e1724);
    border: 2px solid #38577a;
    border-radius: 24px;
    padding: 26px 22px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(46,204,113,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: #fff;
    animation: popModal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popModal {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .store-icon-big {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2980b9, #1b4965);
    border: 3px solid #74b9ff;
    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .store-name {
    font-size: 22px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.2;
  }
  .store-desc {
    font-size: 13px;
    color: #b2bec3;
    line-height: 1.5;
  }
  .store-rating {
    color: #ffd166;
    font-size: 14px;
    font-weight: 700;
  }
  .btn-install-big {
    width: 100%;
    background: linear-gradient(180deg, #2ecc71, #27ae60);
    border: none;
    border-radius: 25px;
    padding: 12px;
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(46,204,113,0.5);
    transition: transform 0.1s;
  }
  .btn-install-big:active {
    transform: scale(0.97);
  }
  .btn-resume {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 8px 18px;
    color: #dfe6e9;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>

<div id="floating-text-container"></div>

<!-- Top Left Whiteout Survival Brand -->
<div id="top-left-ad">
  <div class="logo-box">

      <span class="play-badge">▶ Open Store</span>

    <div class="store-desc">
      極寒暴風雪降臨！伐木築橋、建造巨大熔爐、集結生還者拯救冰封世界！

<script>
// ==========================================
// 1. WEB AUDIO SYNTHESIZER (NO EXTERNAL AUDIO NEEDED)
// ==========================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.initDone = false;
  }
  init() {
    if (this.initDone) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
        this.initDone = true;
      }
    } catch(e) {}
  }
  playChop() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    
    // Thump
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.12);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.13);

    // Crack noise
    const bufferSize = this.ctx.sampleRate * 0.06;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = this.ctx.createGain();
    noiseGain.gain.setValueAtTime(0.3, now);
    noiseGain.gain.linearRampToValueAtTime(0.01, now + 0.06);
    noise.connect(noiseGain);
    noiseGain.connect(this.ctx.destination);
    noise.start(now);
  }
  playPop() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, now);
    osc.frequency.exponentialRampToValueAtTime(840, now + 0.1);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.11);
  }
  playCash() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [987, 1318].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.06);
      gain.gain.setValueAtTime(0.2, now + idx * 0.06);
      gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.06 + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.06);
      osc.stop(now + idx * 0.06 + 0.16);
    });
  }
  playUpgrade() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.25, now + idx * 0.08);
      gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.25);
    });
  }
}
const sfx = new SoundFX();

// ==========================================
// 2. GAME STATE & RESOURCE HUD
// ==========================================
const state = {
  cash: 0,
  wood: 0,
  meat: 0,
  gold: 0,
  furnaceLevel: 1,
  campBuilt: false,
  mineUnlocked: false,
  bridgeLength: 4 // initial plank segments built
};

const hud = {
  valCash: document.getElementById('val-cash'),
  valWood: document.getElementById('val-wood'),
  valMeat: document.getElementById('val-meat'),
  valGold: document.getElementById('val-gold'),
  pillCash: document.getElementById('pill-cash'),
  pillWood: document.getElementById('pill-wood'),
  pillMeat: document.getElementById('pill-meat'),
  pillGold: document.getElementById('pill-gold')
};

function formatNum(n) {
  return n.toLocaleString();
}

function addResource(type, amt, worldPos = null) {
  state[type] += amt;
  const pill = hud['pill' + type.charAt(0).toUpperCase() + type.slice(1)];
  const valEl = hud['val' + type.charAt(0).toUpperCase() + type.slice(1)];
  if (valEl) valEl.textContent = formatNum(state[type]);
  if (pill) {
    pill.classList.remove('bounce');
    void pill.offsetWidth;
    pill.classList.add('bounce');
  }
  if (worldPos) {
    spawnFloatLabel(worldPos, `+${amt}`, type);
  }
}

// Floating labels over 3D world
const floatContainer = document.getElementById('floating-text-container');
function spawnFloatLabel(pos3D, text, type) {
  const el = document.createElement('div');
  el.className = `float-label ${type}`;
  el.textContent = text;
  floatContainer.appendChild(el);
  
  const tempV = new THREE.Vector3().copy(pos3D);
  tempV.y += 1.8;
  tempV.project(camera);
  const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;

  setTimeout(() => {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 850);
}

// ==========================================
// 3. THREE.JS SCENE SETUP
// ==========================================
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7e7f5);
scene.fog = new THREE.Fog(0xd7e7f5, 30, 95);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 300);
camera.position.set(0, 32, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb8d2e8, 0.7);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 0.95);
dirLight.position.set(25, 45, 15);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 5;
dirLight.shadow.camera.far = 120;
const d = 35;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
scene.add(dirLight);

// Ground (Snow)
const snowGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
const snowMat = new THREE.MeshStandardMaterial({
  color: 0xf3f8fc,
  roughness: 0.9,
  metalness: 0.05
});
const snowMesh = new THREE.Mesh(snowGeo, snowMat);
snowMesh.rotation.x = -Math.PI / 2;
snowMesh.receiveShadow = true;
scene.add(snowMesh);

// Base camp diagonal platform (South deck)
const baseDeckGroup = new THREE.Group();
const deckGeo = new THREE.BoxGeometry(45, 0.6, 26);
const woodDeckMat = new THREE.MeshStandardMaterial({
  color: 0x93512b,
  roughness: 0.8
});
const deckMesh = new THREE.Mesh(deckGeo, woodDeckMat);
deckMesh.position.set(0, 0.2, 16);
deckMesh.rotation.y = -0.38; // diagonal angle matching video
deckMesh.receiveShadow = true;
baseDeckGroup.add(deckMesh);

// Diagonal wooden fence / palisade logs along edge of deck
const fenceMat = new THREE.MeshStandardMaterial({ color: 0x6e3d20, roughness: 0.9 });
for (let i = -20; i <= 20; i += 1.8) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 2.2, 6), fenceMat);
  post.position.set(i, 1.2, 13);
  post.rotation.y = -0.38;
  post.castShadow = true;
  baseDeckGroup.add(post);
}
scene.add(baseDeckGroup);

// Natural snow boulders around camp
const rockMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.95 });
[
  [-12, 0, 8], [14, 0, 7], [-18, 0, 18], [19, 0, 22]
].forEach(([rx, ry, rz]) => {
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4, 1), rockMat);
  rock.position.set(rx, ry + 0.8, rz);
  rock.scale.set(1.2, 0.8, 1);
  rock.castShadow = true;
  scene.add(rock);
});

// ==========================================
// 4. THE GRAND FURNACE & VERTICAL ENERGY BEAM
// ==========================================
const furnaceGroup = new THREE.Group();
furnaceGroup.position.set(-6, 0.5, 12);

// Furnace brick base
const baseFurnace = new THREE.Mesh(
  new THREE.CylinderGeometry(2.4, 2.8, 2.6, 8),
  new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.85 })
);
baseFurnace.position.y = 1.3;
baseFurnace.castShadow = true;
furnaceGroup.add(baseFurnace);

// Metal chimney stack
const stackMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1.2, 1.4, 3.5, 8),
  new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.4, metalness: 0.7 })
);
stackMesh.position.y = 3.6;
stackMesh.castShadow = true;
furnaceGroup.add(stackMesh);

// HUGE VERTICAL ENERGY BEAM (Exact signature green beam from video!)
const beamGeo = new THREE.CylinderGeometry(0.7, 0.7, 70, 16, 1, true);
const beamMat = new THREE.MeshBasicMaterial({
  color: 0x2ecc71,
  transparent: true,
  opacity: 0.85,
  side: THREE.DoubleSide
});
const energyBeam = new THREE.Mesh(beamGeo, beamMat);
energyBeam.position.y = 35;

// Virtual Joystick Handler
const joyBase = document.getElementById('joystick-base');
const joyKnob = document.getElementById('joystick-knob');
const joyHint = document.getElementById('joystick-hint');

let joyActive = false;
let joyCenter = { x: 0, y: 0 };
const joyMaxDist = 42;

function handleJoyStart(cx, cy) {
  sfx.init();
  joyActive = true;
  const rect = joyBase.getBoundingClientRect();
  joyCenter = {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
  handleJoyMove(cx, cy);
  joyHint.style.opacity = '0';
}

function handleJoyMove(cx, cy) {
  if (!joyActive) return;
  const dx = cx - joyCenter.x;
  const dy = cy - joyCenter.y;
  const dist = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);

  const clampedDist = Math.min(dist, joyMaxDist);
  const kx = Math.cos(angle) * clampedDist;
  const ky = Math.sin(angle) * clampedDist;

  joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;

  input.x = kx / joyMaxDist;
  input.z = ky / joyMaxDist;
  input.active = dist > 4;
}

function handleJoyEnd() {
  joyActive = false;
  joyKnob.style.transform = `translate(0px, 0px)`;
  input.x = 0;
  input.z = 0;
  input.active = false;
}

// Touch events on joystick & screen
joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  handleJoyStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (joyActive && e.touches.length > 0) {
    handleJoyMove(e.touches[0].clientX, e.touches[0].clientY);
  }
});
window.addEventListener('touchend', handleJoyEnd);

// Mouse drag controls for testing on desktop
joyBase.addEventListener('mousedown', e => {
  handleJoyStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if (joyActive) handleJoyMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', handleJoyEnd);

}

// ==========================================
// 13. CHOPPING & EXTENDING THE BRIDGE (CORE AD GAMEPLAY)
// ==========================================
let chopCooldown = 0;
let isChopping = false;
let chopTimer = 0;

function handleChopping(dt) {
  if (chopCooldown > 0) chopCooldown -= dt;

  // Find nearest tree to player within chopping reach
  let nearestTree = null;
  let minDist = 2.8;

  for (const tree of trees) {
    if (tree.userData.chopped) continue;
    const dist = playerGroup.position.distanceTo(tree.position);
    if (dist < minDist) {
      minDist = dist;
      nearestTree = tree;
    }
  }

  if (nearestTree && chopCooldown <= 0) {
    // Face the tree
    const targetAngle = Math.atan2(
      nearestTree.position.x - playerGroup.position.x,
      nearestTree.position.z - playerGroup.position.z
    );
    playerGroup.rotation.y = targetAngle;

    // Trigger axe chop swing animation
    isChopping = true;
    chopTimer = 0.28;
    chopCooldown = 0.32;
    sfx.playChop();

    // Slash arc flash
    slashTrail.material.opacity = 0.9;
    spawnWoodChips(nearestTree.position);

    // Tree wobble effect
    nearestTree.rotation.z = (Math.random() - 0.5) * 0.25;

    nearestTree.userData.hp--;
    if (nearestTree.userData.hp <= 0) {
      nearestTree.userData.chopped = true;
      sfx.playPop();

      // Animate tree shrinking/felling
      const fellingTree = nearestTree;
      let fellProgress = 0;
      const fellInterval = setInterval(() => {
        fellProgress += 0.1;
        fellingTree.scale.multiplyScalar(0.82);
        fellingTree.position.y -= 0.15;
        if (fellProgress >= 1) {
          clearInterval(fellInterval);
          fellingTree.visible = false;
        }
      }, 30);

      // Spawn flying wood logs to player
      for (let i = 0; i < 3; i++) {
        spawnFlyingItem(nearestTree.position, playerGroup.position, 'wood', () => {
          addResource('wood', 1, playerGroup.position);
          sfx.playPop();

          // EXTEND BRIDGE FORWARD! (Signature mechanic)
          extendBridgeForward();
        });
      }

      // Respawn tree after 15 seconds so wilderness is always full
      setTimeout(() => {
        nearestTree.userData.chopped = false;
        nearestTree.userData.hp = nearestTree.userData.maxHp;
        nearestTree.visible = true;
        nearestTree.scale.set(1, 1, 1);
        nearestTree.position.y = 0;
        nearestTree.rotation.set(0, 0, 0);
      }, 15000);
    }
  }

  // Animate axe swing
  if (isChopping) {
    chopTimer -= dt;
    const swingFactor = Math.sin((0.28 - chopTimer) / 0.28 * Math.PI);
    rightArmPivot.rotation.x = -Math.PI / 3 - swingFactor * 1.5;
    slashTrail.material.opacity = Math.max(0, slashTrail.material.opacity - dt * 3.5);

    if (chopTimer <= 0) {
      isChopping = false;
      rightArmPivot.rotation.x = 0;
      slashTrail.material.opacity = 0;
    }
  }
}

// Extends wooden bridge planks forward along the path
function extendBridgeForward() {
  if (state.bridgeLength < bridgeTotalSegments - 1) {
    state.bridgeLength++;
    const plank = bridgePlanks[state.bridgeLength];
    if (plank) {
      plank.visible = true;
      plank.scale.set(0.1, 0.1, 0.1);
      let s = 0.1;
      const popInt = setInterval(() => {
        s += 0.25;
        if (s >= 1) {
          plank.scale.set(1, 1, 1);
          clearInterval(popInt);
        } else {
          plank.scale.set(s, s, s);
        }
      }, 25);
    }
  }
}

// ==========================================
// 14. CASH STACK & UPGRADE PAD INTERACTIONS
// ==========================================
let cashCollectTimer = 0;
let minecartT = 0;

function updateBaseInteractions(dt) {
  // 1. Collect Cash from Cash Pallet
  cashCollectTimer += dt;
  if (cashCollectTimer > 0.18) {
    cashCollectTimer = 0;
    const distToPallet = playerGroup.position.distanceTo(cashPalletGroup.position);
    if (distToPallet < 4.5) {
      sfx.playCash();
      addResource('cash', 15, playerGroup.position);
      updateCashVisualStacks(Math.floor(Math.random() * 40 + 10));
    }
  }

  // 2. Continuous passive cash generation from base survivors
  if (state.campBuilt && Math.random() < 0.02) {
    addResource('cash', 5);
  }

  // 3. Gold mine passive production
  if (state.mineUnlocked && Math.random() < 0.015) {
    addResource('gold', 1, minecart.position);
  }

  // 4. Upgrade Pads step-on checks
  upgradePads.forEach(pad => {
    if (pad.completed) return;
    const dist = playerGroup.position.distanceTo(pad.pos);
    if (dist < 2.4) {
      const needed = pad.cost - pad.paid;
      const available = state[pad.resType];
      if (available > 0 && needed > 0) {
        const transfer = Math.min(available, Math.min(2, needed));
        state[pad.resType] -= transfer;
        pad.paid += transfer;
        
        hud['val' + pad.resType.charAt(0).toUpperCase() + pad.resType.slice(1)].textContent = formatNum(state[pad.resType]);
        pad.updateLabel();
        sfx.playPop();

        if (pad.paid >= pad.cost) {
          pad.completed = true;
          pad.ring.material.color.setHex(0x27ae60);
          pad.updateLabel();
          pad.onComplete();
        }
      }
    }
  });

  // 5. Animate Minecart on rails
  minecartT = (minecartT + dt * 0.04) % 1;
  const cartPos = railCurve.getPoint(minecartT);
  const cartTan = railCurve.getTangent(minecartT);
  minecart.position.copy(cartPos);
  minecart.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), cartTan);

  // 6. Animate Furnace Beam and rings
  ringsGroup.rotation.y += dt * 0.8;
  energyBeam.scale.x = 1.0 + Math.sin(Date.now() * 0.005) * 0.08;
  energyBeam.scale.z = energyBeam.scale.x;

  // 7. Update guiding arrow position (points along bridge to nearest trees)
  const targetZ = 5 - state.bridgeLength * plankStep;
  arrowGroup.position.set(0, 0.35, targetZ + 1.8);
  arrowGroup.position.y = 0.35 + Math.sin(Date.now() * 0.006) * 0.18;
}

// ==========================================
// 15. MAIN GAME LOOP
// ==========================================
const playerSpeed = 7.5;
let walkBob = 0;
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Read Inputs (Joystick + Keyboard WASD)
  let moveX = input.x;
  let moveZ = input.z;

  if (keys['w'] || keys['arrowup']) moveZ -= 1;
  if (keys['s'] || keys['arrowdown']) moveZ += 1;
  if (keys['a'] || keys['arrowleft']) moveX -= 1;
  if (keys['d'] || keys['arrowright']) moveX += 1;

  const len = Math.hypot(moveX, moveZ);
  const isMoving = len > 0.05;

  if (isMoving) {
    const normX = moveX / len;
    const normZ = moveZ / len;

    playerGroup.position.x += normX * playerSpeed * dt;
    playerGroup.position.z += normZ * playerSpeed * dt;

    // Constrain player to world bounds
    playerGroup.position.x = Math.max(-28, Math.min(28, playerGroup.position.x));
    playerGroup.position.z = Math.max(-85, Math.min(28, playerGroup.position.z));

    if (!isChopping) {
      playerGroup.rotation.y = Math.atan2(normX, normZ);
    }

    // Walking animation bob
    walkBob += dt * 14;
    leftLeg.rotation.x = Math.sin(walkBob) * 0.55;
    rightLeg.rotation.x = -Math.sin(walkBob) * 0.55;
    torso.position.y = 1.15 + Math.abs(Math.sin(walkBob)) * 0.08;
  } else {
    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
    torso.position.y = 1.15;
  }

  // Smooth Camera Follow
  const targetCamX = playerGroup.position.x * 0.7;
  const targetCamZ = playerGroup.position.z + 18;
  camera.position.x += (targetCamX - camera.position.x) * 0.08;
  camera.position.z += (targetCamZ - camera.position.z) * 0.08;
  camera.position.y = 22;
  camera.lookAt(playerGroup.position.x * 0.4, 0.5, playerGroup.position.z - 4);

  // Chopping and tree felling mechanics
  handleChopping(dt);

  // Base camp upgrade pads and cash collection
  updateBaseInteractions(dt);

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vel.y -= 18 * dt; // gravity
    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }

  // Update flying resource items
  for (let i = flyingItems.length - 1; i >= 0; i--) {
    const f = flyingItems[i];
    f.progress += dt * f.speed;
    const t = Math.min(1, f.progress);
    
    // Parabolic arc
    const curX = THREE.MathUtils.lerp(f.start.x, f.end.x, t);
    const curZ = THREE.MathUtils.lerp(f.start.z, f.end.z, t);
    const curY = THREE.MathUtils.lerp(f.start.y + 1, f.end.y + 0.8, t) + Math.sin(t * Math.PI) * 2.2;
    f.mesh.position.set(curX, curY, curZ);
    f.mesh.rotation.y += dt * 10;

    if (t >= 1) {
      scene.remove(f.mesh);
      if (f.onEnd) f.onEnd();
      flyingItems.splice(i, 1);
    }
  }

  // Update Survivor NPCs roaming
  survivors.forEach(surv => {
    surv.userData.timer += dt;
    if (surv.userData.timer > 3.5 || !surv.userData.target) {
      surv.userData.timer = 0;
      surv.userData.target = new THREE.Vector3(
        (Math.random() - 0.5) * 16,
        0.2,
        8 + Math.random() * 12
      );
      surv.userData.drawEmote(surv.userData.emotes[Math.floor(Math.random() * surv.userData.emotes.length)]);
    }
    const dir = new THREE.Vector3().subVectors(surv.userData.target, surv.position);
    if (dir.length() > 0.5) {
      dir.normalize();
      surv.position.addScaledVector(dir, surv.userData.speed * dt);
      surv.rotation.y = Math.atan2(dir.x, dir.z);
    }
  });

  renderer.render(scene, camera);
}

// Handle Window Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Kickoff
requestAnimationFrame(animate);
</script>
